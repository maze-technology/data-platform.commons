# Auto-tag on main → versioned Maven publish on the tag pipeline.
# Maven publish to GitLab group Package Registry (data-platform).
# Auth: CI_JOB_TOKEN (write to this project's packages, visible via group Maven URL).
# Local/dev: export GITLAB_TOKEN (read_api + read_package_registry) or use group Deploy Token
# via GITLAB_MAVEN_USER / GITLAB_MAVEN_PASSWORD.
#
# Note: CI_JOB_TOKEN inbound allowlists may be required for cross-project reads with job tokens;
# group CI vars GITLAB_MAVEN_* (Deploy Token) are the preferred read path for consumers/templates.
#
# Java version: .sdkmanrc (use_sdkman defaults true in templates). job_image is only the
# bootstrap container; SDKMAN installs/activates the JDK from .sdkmanrc when present.
# infrastructure-base v0.2.20 tag_release uses stage "validate".

stages: [validate, test, publish]

include:
  - project: "data-platform/infrastructure-base"
    ref: "v0.2.25"
    file: "/ci/templates/smithy-fmt.gitlab-ci.yml"
  - project: "data-platform/infrastructure-base"
    ref: "v0.2.25"
    file: "/ci/templates/java-build.gitlab-ci.yml"
    inputs:
      build_script: "make build"
      install_smithy_tools: "true"
  - project: "data-platform/infrastructure-base"
    ref: "v0.2.25"
    file: "/ci/templates/tag-release.gitlab-ci.yml"
  - project: "data-platform/infrastructure-base"
    ref: "v0.2.25"
    file: "/ci/templates/release-approval.gitlab-ci.yml"
  - project: "data-platform/infrastructure-base"
    ref: "v0.2.25"
    file: "/ci/templates/maven-publish.gitlab-ci.yml"
    inputs:
      install_smithy_tools: "true"
      pre_publish: "make pre-build"
