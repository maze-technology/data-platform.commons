# DISABLED: GitLab Package Registry is the primary Maven publish path
# (see .gitlab-ci.yml → infrastructure-base ci/templates/maven-publish.gitlab-ci.yml).
# Kept as workflow_dispatch-only so GitHub Actions does not keep publishing to GitHub Packages.
name: Publish

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Only enable temporarily for emergency GitHub Packages publishes"
        required: false
        default: "disabled"

jobs:
  disabled:
    name: Disabled (GitLab primary)
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: |
          echo "Maven publish runs on GitLab CI → group Package Registry"
          echo "Re-enable this workflow only for emergency GitHub Packages publishes."
          exit 0
